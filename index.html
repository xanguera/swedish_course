<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#58cc02" />
  <title>Lär dig svenska · Learn Swedish for Stockholm</title>
  <meta name="description" content="A friendly, from-scratch Swedish course for a family trip to Stockholm — vocabulary, phrases, culture and fun facts." />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫎</text></svg>" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Svenska" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Top bar (stats) -->
    <header class="topbar" id="topbar" hidden>
      <button class="topbar__brand" data-nav="#/" aria-label="Home">
        <span class="topbar__moose">🫎</span>
        <span class="topbar__title">Svenska</span>
      </button>
      <div class="topbar__stats">
        <div class="stat stat--streak" title="Day streak"><span class="stat__icon">🔥</span><span class="stat__val" id="stat-streak">0</span></div>
        <div class="stat stat--xp" title="Total XP"><span class="stat__icon">⭐</span><span class="stat__val" id="stat-xp">0</span></div>
        <div class="stat stat--hearts" title="Hearts"><span class="stat__icon">❤️</span><span class="stat__val" id="stat-hearts">5</span></div>
      </div>
      <button class="lang-btn" id="lang-btn" data-nav="#/setup" aria-label="Settings">🇬🇧</button>
    </header>

    <!-- Views are rendered here -->
    <main id="view" class="view" role="main"></main>

    <!-- Bottom navigation -->
    <nav class="tabbar" id="tabbar" hidden>
      <button class="tab" data-nav="#/" data-tab="learn"><span class="tab__icon">🏠</span><span class="tab__label">Learn</span></button>
      <button class="tab" data-nav="#/practice" data-tab="practice"><span class="tab__icon">🔁</span><span class="tab__label">Practice</span></button>
      <button class="tab" data-nav="#/culture" data-tab="culture"><span class="tab__icon">🇸🇪</span><span class="tab__label">Culture</span></button>
      <button class="tab" data-nav="#/phrasebook" data-tab="phrasebook"><span class="tab__icon">📖</span><span class="tab__label">Phrases</span></button>
    </nav>
  </div>

  <!-- Confetti canvas for celebrations -->
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <!-- Data (edit these to add content) -->
  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/coredata.js"></script>
  <script src="data/vocab.js"></script>
  <script src="data/culture.js"></script>
  <script src="data/lessons.js"></script>
  <script src="data/course.js"></script>
  <!-- Catalan (ca) course -->
  <script src="data/vocab_ca.js"></script>
  <script src="data/culture_ca.js"></script>
  <script src="data/lessons_ca.js"></script>
  <script src="data/course_ca.js"></script>

  <!-- Language packs (add one file per mother tongue) -->
  <script src="data/i18n_en.js"></script>
  <script src="data/i18n_pt.js"></script>
  <!-- Catalan target registry + packs -->
  <script src="data/i18n_ca.js"></script>
  <script src="data/i18n_ca_pt.js"></script>

  <!-- Engine -->
  <script src="js/audio.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
